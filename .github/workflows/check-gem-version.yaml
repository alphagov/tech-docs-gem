name: check-gem-version
on:
  workflow_call:
    outputs:
      version-changed:
        value: ${{ jobs.check-gem-version.outputs.version-changed }}


jobs:
  check-gem-version:
    runs-on: ubuntu-latest
    outputs:
      version-changed: ${{ steps.gem_version.outputs.version-changed }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false

      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: '3'

      - name: Gem version changed
        id: gem_version
        run: |
          gem_version=$(ruby -Ilib -r govuk_tech_docs/version -e "puts GovukTechDocs::VERSION")
          echo "gem_version=$gem_version" >> "$GITHUB_OUTPUT"
  
          if git fetch origin "refs/tags/v$gem_version" >/dev/null 2>&1
          then
            echo "Tag 'v$gem_version' already exists"
            echo "version-changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "version-changed=true" >> "$GITHUB_OUTPUT"
          fi