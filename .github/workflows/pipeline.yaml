name: pipeline
on:
#  pull_request:
#    branches: [ "main"]
  push:
    branches: [ "bugfix/github-publication-steps"]

jobs:
#  npm-vulnerability-scanner:
#    uses: ./.github/workflows/npm-vulnerability-scanner.yaml
#    permissions:
#      contents: read
#
#  ruby-vulnerability-scanner:
#    needs: npm-vulnerability-scanner
