name: Test

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read          # Allows the action to check out your repository code
  pull-requests: write    # Allows the action to comment on or update the Dependabot PR
  statuses: write         # Allows the action to post pass/fail build statuses

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.4', '4.0']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Lint Ruby and javascript files
        run: bundle exec rake lint

      - name: Run Ruby unit tests
        run: bundle exec rake spec

      - name: Run Javascript tests
        run: bundle exec rake jasmine:ci
