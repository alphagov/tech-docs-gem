name: Publish

on:
  workflow_call:
    inputs:
      new-gem-version:
        default: false
        type: boolean
  
  workflow_dispatch:
    inputs:
      new-gem-version:
        description: 'Force publish gem?'
        default: false
        type: boolean

concurrency: rubygems

permissions:
  contents: write
  id-token: write

jobs:
  deploy:
    name: Publish Ruby Gem
#    environment: rubygems
    permissions:
      contents: write  # needed to be able to tag the release
      id-token: write
    runs-on: ubuntu-latest
    if: inputs.new-gem-version

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm install

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3'
          bundler-cache: true

      - name: Debug - Check if node_modules exists
        run: ls -la node_modules/

      - name: Debug - Check inside the gem folder
        run: ls -la node_modules/govuk-frontend/ || echo "Folder node_modules/govuk-frontend does not exist!"

      - name: Debug - Test Gemspec evaluation
        run: ruby -e "spec = eval(File.read(Dir['*.gemspec'].first)); puts 'FOUND ASSETS:', spec.files.grep(/node_modules/)"

      - name: Build the Gem manually
        run: gem build *.gemspec

      - name: Inspect packed contents in log
        run: |
          # Find the generated .gem file
          GEM_FILE=$(ls *.gem | head -n 1)
          echo "Unpacking $GEM_FILE..."
          
          # Unpack it to a folder
          gem unpack $GEM_FILE
          
          # Go into the unpacked folder and list what it actually captured
          UNPACKED_DIR=${GEM_FILE%.gem}
          echo "Contents of node_modules/govuk-frontend inside the built gem:"
          ls -la $UNPACKED_DIR/node_modules/govuk-frontend || echo "Directory missing from package!"

      - name: Upload Gem as Artifact (Downloadable)
        uses: actions/upload-artifact@v4
        with:
          name: debug-gem-package
          path: "*.gem"



