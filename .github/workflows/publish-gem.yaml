name: Publish

on:
  workflow_call:
    inputs:
      new-gem-version:
        default: false
        type: boolean
  
  workflow_dispatch:
    inputs:
      new-gem-version:
        description: 'Force publish gem?'
        default: false
        type: boolean

concurrency: rubygems

permissions:
  contents: write
  id-token: write

jobs:
  deploy:
    name: Publish Ruby Gem
    environment: rubygems
    permissions:
      contents: write  # needed to be able to tag the release
      id-token: write
    runs-on: ubuntu-latest
    if: inputs.new-gem-version

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: '3'
          bundler-cache: true

      - name: Publish to rubygems.org
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
